[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-auto-router"
version = "0.2.0"
description = "OpenAI-compatible gateway that routes each request to the best available model, with a self-hosted AI work tracker"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = [
    "mypy==2.4.1",
    "pre-commit>=4.0",
    "pytest-cov==7.0.0",
    "ruff==0.17.5",
    "types-PyYAML",
]

[tool.setuptools]
py-modules = ["balance", "catalog", "discovery", "gateway", "matching", "refresh",
              "selector", "sse", "state", "titles", "tracker"]
# ``integrations`` intentionally has no ``__init__`` (the git hook must stay a
# standalone stdlib script); ship its modules explicitly.
packages = ["worktracker", "integrations", "integrations.git"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.package-data]
worktracker = ["ui/*.html", "ui/*.js"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",  # long explanatory URLs, headers and SQL strings are fine
    "RUF001", "RUF002", "RUF003",  # typographic punctuation in prose
    "B008",  # FastAPI Depends()/Body() defaults are idiomatic
    "UP017",  # dt.timezone.utc is fine; matches the rest of the codebase
    "SIM105",  # bare try/except/pass mirrors surrounding code style
    "RUF005",  # explicit list concatenation keeps SQL builders readable
    "RUF059",  # unpacked-but-unused helpers in tests are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
files = ["balance.py", "catalog.py", "discovery.py", "gateway.py", "matching.py",
         "refresh.py", "selector.py", "sse.py", "state.py", "titles.py", "tracker.py",
         "worktracker", "integrations/git/worktracker_hook.py"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true
disallow_untyped_defs = false
exclude = ["tests/", "integrations/opencode/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "postgres: needs TEST_ROUTER_DATABASE_URL pointing at a disposable PostgreSQL database",
]

[tool.coverage.run]
branch = true
source = ["worktracker", "integrations/git"]
omit = [
    "integrations/git/worktracker_hook.py",  # covered by tests/test_workhook.py
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
