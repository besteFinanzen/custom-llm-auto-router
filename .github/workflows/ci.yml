name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests, lint, types, coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: wt_ci
          POSTGRES_PASSWORD: wt_ci_password
          POSTGRES_DB: wt_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wt_ci -d wt_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_ROUTER_DATABASE_URL: postgresql://wt_ci:wt_ci_password@127.0.0.1:5432/wt_ci
      ROUTER_TITLES_CMD: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Types
        run: mypy
      - name: Tests + coverage
        # postgres is a service container here, so the integration suite runs.
        # The gate only measures the new Worktracker/hook code.
        run: |
          pytest -q --cov --cov-report=term-missing
          python -m coverage report --include='worktracker/*,integrations/git/*' --fail-under=85

  plugin:
    name: OpenCode plugin (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/opencode/plugins/router-tags
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: integrations/opencode/plugins/router-tags/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test -- --run
      - name: Dependency audit
        run: npm audit --audit-level=high

  audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install pip-audit==2.9.0
      # Runtime dependencies only: dev tooling never reaches the image.
      - run: pip-audit -r requirements.txt

  docker:
    name: Docker image builds and serves /healthz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t llm-auto-router:ci .
      - name: Tracker CLI ships in the image
        run: docker run --rm llm-auto-router:ci python -m worktracker --help
      - name: Smoke test container
        run: |
          docker run -d --name router-ci -p 4141:4141 llm-auto-router:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4141/healthz > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4141/healthz
          curl -fsS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:4141/worktracker
          docker logs router-ci
          docker rm -f router-ci
